name: CI

on:
  push:
    branches:
      - main
      - game-1.1
      - game-1.2
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 + 构建 (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # CI 机器比开发机慢,bomb-buddies 那个「三档电脑各打三分钟」的模拟用例
      # 本地 4 秒出头、在 runner 上会顶破 vitest 默认的 5 秒而假失败,
      # 所以这里统一把单个用例的超时放宽到 30 秒(不改 vite.config.ts)。
      - name: 单元测试
        run: npm test -- --testTimeout=30000

      - name: 类型检查 + 构建
        run: npm run build
